name: Mirror image

# Fork-only: builds the ocpp-mirror branch and publishes it to ghcr.io of the
# repository owner. Run manually or on every push to the branch.

on:
  workflow_dispatch:
  push:
    branches: [ocpp-mirror]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # the build derives its version number from the latest tag, forks may lack them
      - name: Fetch upstream tags
        run: git fetch --tags --force https://github.com/evcc-io/evcc.git

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/evcc
          tags: |
            type=raw,value=mirror
            type=sha,prefix=mirror-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
